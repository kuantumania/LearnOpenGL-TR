site_name: LearnOpenGL TR
site_description: Joey de Vries'in efsanevi LearnOpenGL kaynağının modern Türkçe çevirisi ve grafik programlama rehberi.
site_author: Batuhan Dev
repo_name: kuantumania/LearnOpenGL-TR
repo_url: https://github.com/kuantumania/LearnOpenGL-TR
edit_uri: edit/main/docs/
site_url: https://kuantumania.github.io/LearnOpenGL-TR/

theme:
  name: material
  language: tr
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: Açık temaya geç
    - scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Koyu temaya geç
  font:
    text: Inter
    code: JetBrains Mono
  logo: img/getting-started/opengl.jpg
  favicon: img/getting-started/opengl.jpg

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html
  - tables

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

nav:
  - Giriş: index.md
  - 1. Başlarken:
      - OpenGL Nedir?: 01-baslarken/01-opengl-nedir.md
      - Bir Pencere Oluşturma: 01-baslarken/02-pencere-olusturma.md
      - Merhaba Pencere: 01-baslarken/03-merhaba-pencere.md
      - Merhaba Üçgen: 01-baslarken/04-merhaba-ucgen.md
      - Shader'lar: 01-baslarken/05-shaderlar.md
      - Dokular (Textures): 01-baslarken/06-dokular.md
      - Dönüşümler (Transformations): 01-baslarken/07-donusumler.md
      - Koordinat Sistemleri: 01-baslarken/08-koordinat-sistemleri.md
      - Kamera: 01-baslarken/09-kamera.md
      - Özet ve Sözlük: 01-baslarken/10-ozet.md
  - 2. Aydınlatma:
      - Renkler: 02-aydinlatma/01-renkler.md
      - Temel Aydınlatma: 02-aydinlatma/02-temel-aydinlatma.md
      - Malzemeler: 02-aydinlatma/03-malzemeler.md
      - Işık Haritaları: 02-aydinlatma/04-isik-haritalari.md
      - Işık Kaynakları: 02-aydinlatma/05-isik-kaynaklari.md
      - Çoklu Işıklar: 02-aydinlatma/06-coklu-isiklar.md
      - Özet ve Sözlük: 02-aydinlatma/07-aydinlatma-ozeti.md
  - 3. Model Yükleme:
      - Assimp Giriş: 03-model-yukleme/01-assimp.md
      - Mesh Sınıfı: 03-model-yukleme/02-mesh.md
      - Model Sınıfı: 03-model-yukleme/03-model.md
  - Katkıda Bulunma: katkida-bulunma.md
